name: PVS-Studio image

on:
    push:
        paths:
            - 'docker/pvs-studio.Dockerfile'
        branches:
            - develop
            - main
    workflow_dispatch:
    schedule:
        # Weekly rebuild to pick up analyzer updates from the PVS-Studio apt repo.
        - cron: '0 3 * * 1'

concurrency:
    group: ${{ github.workflow }}
    cancel-in-progress: true

permissions:
    contents: read
    packages: write

jobs:
    build-image:
        name: Build and publish PVS-Studio image
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false

            -   name: Set up Docker Buildx
                uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

            -   name: Log in to GitHub Container Registry
                uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
                with:
                    registry: ghcr.io
                    username: ${{ github.actor }}
                    password: ${{ secrets.GITHUB_TOKEN }}

            -   name: Derive image tags
                id: meta
                run: |
                    echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

            -   name: Build and push image
                uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
                with:
                    context: .
                    file: docker/pvs-studio.Dockerfile
                    push: true
                    tags: |
                        ghcr.io/squirix/braid-pvs-studio:latest
                        ghcr.io/squirix/braid-pvs-studio:${{ steps.meta.outputs.sha }}
                    cache-from: type=gha
                    cache-to: type=gha,mode=max
