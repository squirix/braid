name: Docs

on:
    pull_request:
        branches: [main, develop]
        paths:
            - 'docs/**'
            - '**/*.md'
            - '.markdownlint.json'
            - '.markdownlint-cli2.jsonc'
            - 'LICENSE'
            - '.gitignore'
            - '.gitattributes'
            - '.editorconfig'
    push:
        branches: [main, develop]
        paths:
            - 'docs/**'
            - '**/*.md'
            - '.markdownlint.json'
            - '.markdownlint-cli2.jsonc'
            - 'LICENSE'
            - '.gitignore'
            - '.gitattributes'
            - '.editorconfig'

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    metadata:
        name: Docs and metadata gate
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Run Markdownlint
              uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24
              with:
                  config: .markdownlint-cli2.jsonc

            - name: Validate paths
              run: echo "Docs or metadata-only change; full build skipped by CI paths-ignore."
