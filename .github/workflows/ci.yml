name: CI

on:
    push:
        branches: [main, develop]
        paths-ignore:
            - 'docs/**'
            - '**/*.md'
            - 'README.md'
            - 'CHANGELOG.md'
            - 'SECURITY.md'
            - 'LICENSE'
            - '.gitignore'
            - '.gitattributes'
            - '.editorconfig'
    pull_request:
        branches: [main, develop]
        paths-ignore:
            - 'docs/**'
            - '**/*.md'
            - 'README.md'
            - 'CHANGELOG.md'
            - 'SECURITY.md'
            - 'LICENSE'
            - '.gitignore'
            - '.gitattributes'
            - '.editorconfig'
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    build:
        name: Build and test
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup .NET
              uses: actions/setup-dotnet@v6
              with:
                  global-json-file: global.json
                  dotnet-version: '10.0.x'
                  cache: true
                  cache-dependency-path: |
                      **/*.csproj
                      Directory.Build.props
                      Directory.Packages.props
                      global.json

            - name: Restore
              run: dotnet restore

            - name: Build
              run: dotnet build --configuration Release --no-restore

            - name: Test .NET 10 with coverage
              run: |
                  set -o pipefail
                  dotnet test --framework net10.0 --configuration Release --no-build \
                    --results-directory "${{ github.workspace }}/coverage" \
                    --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml

            - name: Test .NET 11
              run: dotnet test --framework net11.0 --configuration Release --no-build

            - name: Verify Coverage Collected
              shell: bash
              run: |
                  set -euo pipefail
                  mapfile -t files < <(find coverage -name coverage.cobertura.xml -type f 2>/dev/null || true)
                  if [ ${#files[@]} -eq 0 ]; then
                    echo "No coverage.cobertura.xml produced by the test run." >&2
                    find coverage -type f -print 2>/dev/null || true
                    exit 1
                  fi
                  echo "Found ${#files[@]} Cobertura report(s)."

            - name: Upload Coverage Files
              uses: actions/upload-artifact@v7
              with:
                  name: coverage-raw-net10.0-ci
                  retention-days: 1
                  path: coverage/**/coverage.cobertura.xml
                  if-no-files-found: error

            - name: Run file-based examples
              run: bash examples/single-file/run-examples.sh Release

            - name: Pack
              run: dotnet pack --configuration Release --no-build

    # SonarCloud: same-repo code changes; requires secrets.SONAR_TOKEN + a SonarCloud project
    # (import org squirix, project key braid). PR decoration posts a comment/status on PRs.
    sonarcloud:
        name: SonarCloud
        runs-on: ubuntu-latest
        timeout-minutes: 45
        permissions:
            contents: read
            pull-requests: read
        needs: [ build ]
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION || 'squirix' }}
            SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY || 'braid' }}
        steps:
            -   name: Require SONAR_TOKEN
                shell: bash
                run: |
                    if [[ -z "${SONAR_TOKEN}" ]]; then
                      echo "Missing secrets.SONAR_TOKEN." >&2
                      echo "1) Create a free SonarCloud org/project for public repo squirix/braid" >&2
                      echo "2) Generate a token (My Account → Security)" >&2
                      echo "3) Add GitHub Actions secret SONAR_TOKEN" >&2
                      exit 1
                    fi

            -   name: Checkout
                uses: actions/checkout@v7
                with:
                    fetch-depth: 0
                    persist-credentials: false

            -   name: Setup .NET
                uses: actions/setup-dotnet@v6
                with:
                    global-json-file: global.json

            -   name: Cache NuGet Packages
                uses: actions/cache@v6
                with:
                    path: ~/.nuget/packages
                    key: ${{ runner.os }}-dotnet-nuget-${{ hashFiles('**/global.json', '**/Directory.Packages.props', '**/Directory.Build.props', '**/*.csproj', '**/packages.lock.json') }}
                    restore-keys: |
                        ${{ runner.os }}-dotnet-nuget-

            -   name: Cache SonarCloud Scanner
                id: cache-sonar-scanner
                uses: actions/cache@v6
                with:
                    path: .sonar/scanner
                    key: ${{ runner.os }}-sonar-scanner
                    restore-keys: |
                        ${{ runner.os }}-sonar-scanner

            -   name: Install SonarCloud Scanner
                if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
                shell: bash
                run: |
                    mkdir -p .sonar/scanner
                    dotnet tool update dotnet-sonarscanner --tool-path .sonar/scanner

            -   name: Ensure SonarCloud Scanner Present
                shell: bash
                run: |
                    if [[ ! -x .sonar/scanner/dotnet-sonarscanner ]]; then
                      mkdir -p .sonar/scanner
                      dotnet tool update dotnet-sonarscanner --tool-path .sonar/scanner
                    fi

            -   name: Download Coverage Reports
                uses: actions/download-artifact@v8
                with:
                    pattern: coverage-raw-net10.0-*
                    merge-multiple: true
                    path: coverage

            -   name: Verify Cobertura Reports For Sonar
                shell: bash
                run: |
                    mapfile -t files < <(find coverage -name coverage.cobertura.xml -type f 2>/dev/null || true)
                    if [ ${#files[@]} -eq 0 ]; then
                      echo "No coverage.cobertura.xml found for SonarCloud import." >&2
                      echo "Expected Cobertura from the build job (Microsoft.Testing.Extensions.CodeCoverage)." >&2
                      find coverage -type f -print 2>/dev/null || true
                      exit 1
                    fi
                    echo "Found ${#files[@]} Cobertura report(s) for SonarCloud."

            -   name: Restore
                shell: bash
                run: dotnet restore braid.slnx

            -   name: Analyze With SonarCloud
                shell: bash
                env:
                    GITHUB_EVENT_NAME: ${{ github.event_name }}
                    SONAR_PR_KEY: ${{ github.event.pull_request.number }}
                    SONAR_PR_BRANCH: ${{ github.head_ref }}
                    SONAR_PR_BASE: ${{ github.base_ref }}
                    SONAR_PR_GITHUB_REPOSITORY: ${{ github.repository }}
                run: |
                    set -euo pipefail

                    begin_args=(
                      begin
                      "/k:${SONAR_PROJECT_KEY}"
                      "/o:${SONAR_ORGANIZATION}"
                      "/d:sonar.token=${SONAR_TOKEN}"
                      "/d:sonar.host.url=https://sonarcloud.io"
                      "/d:sonar.qualitygate.wait=false"
                      "/d:sonar.exclusions=**/bin/**,**/obj/**,**/.sonar/**,**/examples/**,**/tests/**"
                      "/d:sonar.coverage.exclusions=**/examples/**,**/tests/**"
                      "/d:sonar.cs.cobertura.reportsPaths=${GITHUB_WORKSPACE}/coverage/**/coverage.cobertura.xml"
                    )

                    if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
                      begin_args+=(
                        "/d:sonar.pullrequest.key=${SONAR_PR_KEY}"
                        "/d:sonar.pullrequest.branch=${SONAR_PR_BRANCH}"
                        "/d:sonar.pullrequest.base=${SONAR_PR_BASE}"
                        "/d:sonar.pullrequest.provider=GitHub"
                        "/d:sonar.pullrequest.github.repository=${SONAR_PR_GITHUB_REPOSITORY}"
                      )
                    fi

                    .sonar/scanner/dotnet-sonarscanner "${begin_args[@]}"
                    dotnet build braid.slnx --configuration Release --no-restore
                    .sonar/scanner/dotnet-sonarscanner end "/d:sonar.token=${SONAR_TOKEN}"

    # Aggregates all CI jobs and reports a single required "CI success" check.
    # SonarCloud is skipped on fork PRs, where secrets are unavailable.
    ci-success:
        name: CI success
        runs-on: ubuntu-latest
        timeout-minutes: 5
        needs:
            - build
            - sonarcloud
        if: always()
        steps:
            -   name: Verify Required Checks
                shell: bash
                env:
                    RESULT_BUILD: ${{ needs.build.result }}
                    RESULT_SONAR: ${{ needs.sonarcloud.result }}
                run: |
                    set -euo pipefail
                    failed=0

                    assert_success() {
                      local name="$1"
                      local result="$2"
                      if [[ "$result" == "success" ]]; then
                        echo "OK   $name"
                        return 0
                      fi
                      echo "FAIL $name result=$result" >&2
                      failed=1
                    }

                    assert_success_or_skipped() {
                      local name="$1"
                      local result="$2"
                      if [[ "$result" == "success" || "$result" == "skipped" ]]; then
                        echo "OK   $name result=$result"
                        return 0
                      fi
                      echo "FAIL $name result=$result" >&2
                      failed=1
                    }

                    assert_success "build" "$RESULT_BUILD"
                    assert_success_or_skipped "sonarcloud" "$RESULT_SONAR"

                    if [[ "$failed" -ne 0 ]]; then
                      exit 1
                    fi