name: Release

on:
    push:
        tags:
            - 'v*'

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    build:
        name: Build, test, and validate
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            -   name: Set Git Options
                run: |
                    git config --global core.autocrlf false
                    git config --global core.eol lf

            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false

            -   name: Setup .NET
                uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
                with:
                    global-json-file: global.json
                    dotnet-version: '10.0.x'

            -   name: Restore
                run: dotnet restore

            -   name: Build
                run: dotnet build --configuration Release --no-restore

            -   name: Test
                run: dotnet test --configuration Release --no-build

            -   name: Pack
                run: dotnet pack --configuration Release --no-build --output out/packages

            -   name: Verify package version and target frameworks
                run: |
                    set -euo pipefail
                    version="${GITHUB_REF_NAME#v}"
                    pkg="out/packages/braid.${version}.nupkg"
                    if [ ! -f "${pkg}" ]; then
                        echo "Expected package not found: ${pkg}" >&2
                        ls -la out/packages/ >&2 || true
                        exit 1
                    fi
                    entries="$(unzip -Z1 "$pkg")"
                    for framework in net10.0 net11.0; do
                        grep -Fx "lib/${framework}/Braid.dll" <<< "$entries"
                        grep -Fx "lib/${framework}/Braid.xml" <<< "$entries"
                    done

            -   name: Upload package artifact
                uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
                with:
                    name: nuget-package
                    path: |
                        out/packages/*.nupkg
                        out/packages/*.snupkg
                    if-no-files-found: error

    publish:
        name: Publish to nuget.org and GitHub
        needs: build
        runs-on: ubuntu-latest
        timeout-minutes: 20
        environment: release
        permissions:
            # Write access to create the GitHub Release (draft).
            contents: write
            # OIDC token for NuGet trusted publishing (exchanged for a temporary API key).
            id-token: write
        steps:
            -   name: Download package artifact
                uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
                with:
                    name: nuget-package
                    path: out/packages

            -   name: NuGet login (OIDC to temp API key)
                id: login
                uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
                with:
                    user: ${{ secrets.NUGET_USER }}

            -   name: Publish to nuget.org
                run: |
                    set -euo pipefail
                    shopt -s nullglob
                    # Push only the `.nupkg` files: `dotnet nuget push` also pushes
                    # the `.snupkg` that lies next to a package. A second push of the
                    # symbol package fails with 409 while the first copy is still
                    # pending validation.
                    packages=(out/packages/*.nupkg)
                    if [ ${#packages[@]} -eq 0 ]; then
                        echo "No packages found under out/packages." >&2
                        ls -la out/packages/ >&2 || true
                        exit 1
                    fi
                    for package in "${packages[@]}"; do
                        # Do not pass --skip-duplicate: a package that is already
                        # published under the same version would otherwise be
                        # silently ignored, masking a tag/version mismatch. The
                        # build job already asserts the tag matches the package,
                        # so a duplicate here should fail loudly instead.
                        dotnet nuget push "${package}" \
                            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
                            --source "https://api.nuget.org/v3/index.json"
                    done

            -   name: Create GitHub Release
                uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
                with:
                    draft: true
                    generate_release_notes: true
                    files: |
                        out/packages/*.nupkg
                        out/packages/*.snupkg
