name: Release

on:
    push:
        tags:
            - 'v*'

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    release:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: write
            id-token: write
        steps:
            -   name: Set Git Options
                run: |
                    git config --global core.autocrlf false
                    git config --global core.eol lf

            -   name: Checkout
                uses: actions/checkout@v7
                with:
                    persist-credentials: false

            -   name: Setup .NET
                uses: actions/setup-dotnet@v6
                with:
                    global-json-file: global.json

            -   name: Restore
                run: dotnet restore

            -   name: Build
                run: dotnet build --configuration Release --no-restore

            -   name: Test
                run: dotnet test --configuration Release --no-build

            -   name: Pack
                run: dotnet pack --configuration Release --no-build --output out/packages

            -   name: Upload package artifact
                uses: actions/upload-artifact@v7
                with:
                    name: nuget-package
                    path: |
                        out/packages/*.nupkg
                        out/packages/*.snupkg

            -   name: NuGet login (OIDC to temp API key)
                id: login
                uses: NuGet/login@v1
                with:
                    user: ${{ secrets.NUGET_USER }}

            -   name: Publish to nuget.org
                run: |
                    set -euo pipefail
                    shopt -s nullglob
                    packages=(out/packages/*.nupkg)
                    if [[ ${#packages[@]} -eq 0 ]]; then
                        echo "No .nupkg files found under out/packages." >&2
                        ls -la out/packages/ >&2 || true
                        exit 1
                    fi
                    for package in "${packages[@]}"; do
                        if [[ "$package" == *.snupkg ]]; then
                            continue
                        fi
                        dotnet nuget push "$package" \
                            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
                            --source "https://api.nuget.org/v3/index.json" \
                            --skip-duplicate
                    done

            -   name: Create GitHub Release
                uses: softprops/action-gh-release@v3
                with:
                    draft: true
                    generate_release_notes: true
                    files: |
                        out/packages/*.nupkg
                        out/packages/*.snupkg